openapi: 3.0.3
info:
  title: bzscraper — signing in
  version: "1"
  description: |
    One account. GET /csrf hands out the CSRF token (and sets its cookie XSRF-TOKEN; every
    change sends it back as the header X-XSRF-TOKEN); POST /login starts the session (and the
    "remember me" cookie when asked); GET /me says who is signed in. Every /api address but
    these answers 401 until signed in.
servers:
  - url: /
tags:
  - name: Auth
  - name: SignOut
    description: Answered by the security filter itself (no controller).
paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: csrfToken
      responses:
        "200":
          description: The token (also in the XSRF-TOKEN cookie).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        "401":
          description: Not signed in.
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        "200":
          description: Signed in (a fresh session; the remember-me cookie when asked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        "401":
          description: Wrong name or password (code badCredentials).
          content:
            application/json:
              schema:
                $ref: '../../../../features/gig/src/main/openapi/gig.yaml#/components/schemas/Problem'
  /api/auth/logout:
    post:
      tags: [SignOut]
      operationId: logout
      responses:
        "204":
          description: Signed out; the session and the remember-me cookie are gone.
components:
  schemas:
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
        token:
          type: string
    Me:
      type: object
      required: [username]
      properties:
        username:
          type: string
    Login:
      type: object
      required: [username, password, remember]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember:
          type: boolean
