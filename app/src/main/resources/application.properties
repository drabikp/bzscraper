# Local H2 file database — the source of truth for gigs. Survives restarts.
# Only this app opens the database. bzscraper.db.options=;AUTO_SERVER=TRUE lets a second
# process (an H2 console on a dev machine) in — never in production: a second app instance
# would run a second sync worker over the same tasks.
spring.datasource.url=jdbc:h2:file:${bzscraper.db.path:./data/bzscraper-gigs}${bzscraper.db.options:}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
# A database created by the old ddl-auto=update already has the V1 tables: adopt it at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Plain-SQL backup of the database (H2 SCRIPT) on every start, one file per day.
bzscraper.db.backup.dir=./data/backups
bzscraper.db.backup.keep=14

# Band calendar (read-only): the private iCal address is a secret — set it outside git,
# e.g. BZSCRAPER_CALENDAR_ICALURL. Rules: classpath:calendar/*.profile + the band's own file.
bzscraper.calendar.ical-url=
bzscraper.calendar.zone=Europe/Prague
bzscraper.calendar.presets=sk-cz
bzscraper.calendar.profile-file=./data/calendar-profile.txt

# --- Who may use the app (one account) ---
# bzscraper.auth.username=admin            (default admin)
# bzscraper.auth.password=                 NEVER in source; empty → a random one in the log on start
# bzscraper.auth.remember-me-days=30
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
# the page's files are built by web/frontend; long cache for hashed assets, index.html always fresh
spring.web.resources.cache.cachecontrol.max-age=0
# a JSON body may leave out a yes/no (it is then no)
spring.jackson.deserialization.fail-on-null-for-primitives=false
