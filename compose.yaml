# The app with its database and daily backups:
#   docker/make-secrets.sh        (once: ./secrets from the git-ignored login files)
#   cp .env.example .env          (the band's and this machine's settings; git-ignored)
#   docker compose up -d --build                    → http://localhost:8080 (this machine only)
#   docker compose --profile proxy up -d --build    → online: https://$BZ_DOMAIN through Caddy
# Secrets are files under ./secrets, given to the containers as Docker secrets (never
# environment variables); ./data holds the band's calendar profile and the backups.
name: bzscraper

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bzscraper
      POSTGRES_USER: bzscraper
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
    # only this machine: for running the app outside Docker during development
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bzscraper", "-d", "bzscraper"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        UID: ${BZ_UID:-1000}
        GID: ${BZ_GID:-1000}
    image: bzscraper:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bzscraper
    # each secret appears as /run/secrets/<property name>, read by spring.config.import=configtree
    secrets:
      - source: db_password
        target: spring.datasource.password
      - source: app_password
        target: bzscraper.auth.password
      - source: bandzone_login
        target: bzscraper.bandzone.login
      - source: bandzone_password
        target: bzscraper.bandzone.password
      - source: bandsintown_login
        target: bzscraper.bandsintown.login
      - source: bandsintown_password
        target: bzscraper.bandsintown.password
      - source: bandsintown_totp
        target: bzscraper.bandsintown.totp-secret
      - source: calendar_url
        target: bzscraper.calendar.ical-url
    volumes:
      - ./data:/app/data
      # the platforms' saved logins (Chromium profiles)
      - browser-profiles:/home/bzscraper/.bzscraper
    # this machine only by default (online, the way in is the proxy); BZ_APP_BIND=0.0.0.0
    # opens it to the local network
    ports:
      - "${BZ_APP_BIND:-127.0.0.1}:8080:8080"
    # Chromium's shared memory
    shm_size: 512m
    # names on the internet (the platforms, the calendar, the town search): Docker's own forwarding
    # failed behind a VPN's name servers; container names (db) still resolve. BZ_DNS to change it.
    dns:
      - ${BZ_DNS:-1.1.1.1}

  # online: HTTPS for BZ_DOMAIN (docker/Caddyfile), only with --profile proxy
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # the address the app is reached at (.env); localhost: a try with Caddy's own certificate
      BZ_DOMAIN: ${BZ_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # the certificates: kept, so a restart doesn't ask Let's Encrypt again
      - caddy-data:/data
      - caddy-config:/config

  # pg_dump on start and then daily into ./data/backups, the newest 14 kept
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    user: "${BZ_UID:-1000}:${BZ_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bzscraper
      PGDATABASE: bzscraper
      KEEP: 14
    secrets:
      - db_password
    volumes:
      - ./data/backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

secrets:
  db_password:
    file: ./secrets/db_password
  app_password:
    file: ./secrets/app_password
  bandzone_login:
    file: ./secrets/bandzone_login
  bandzone_password:
    file: ./secrets/bandzone_password
  bandsintown_login:
    file: ./secrets/bandsintown_login
  bandsintown_password:
    file: ./secrets/bandsintown_password
  bandsintown_totp:
    file: ./secrets/bandsintown_totp
  calendar_url:
    file: ./secrets/calendar_url

volumes:
  db-data:
  browser-profiles:
  caddy-data:
  caddy-config:

# A fixed subnet: Docker's own pick (172.x) can collide with a VPN's routes, and the page then
# can't be reached from this machine. Change BZ_SUBNET if this one is taken.
networks:
  default:
    ipam:
      config:
        - subnet: ${BZ_SUBNET:-10.201.0.0/24}
