openapi: 3.0.3
info:
  title: bzscraper — platform check
  version: "1"
  description: |
    Reconciliation: what every platform shows (read-only) compared with the catalog. Running a
    check reads the platforms (slow), so it runs in the background; the live update `check`
    tells when it starts and ends. A difference is fixed with Re-sync (the catalog's API) or,
    for an event gone from the platform, by forgetting the link.
servers:
  - url: /
tags:
  - name: Check
paths:
  /api/check:
    get:
      tags: [Check]
      operationId: checkState
      responses:
        "200":
          description: Whether a check runs, and the latest result (kept in memory).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckState'
  /api/check/run:
    post:
      tags: [Check]
      operationId: runCheck
      responses:
        "202":
          description: Started (or one already runs).
  /api/check/forget:
    post:
      tags: [Check]
      operationId: forgetLink
      summary: Forgets that the gig is on the platform — its event is gone there; Publish creates it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftRef'
      responses:
        "204":
          description: Forgotten.
        "400":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/BadRequest'
        "409":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/Refused'
  /api/check/dismiss:
    post:
      tags: [Check]
      operationId: dismissDrift
      summary: Takes a difference off the latest result (the user acted on it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftRef'
      responses:
        "204":
          description: Taken off.
        "400":
          $ref: '../../../../gig/src/main/openapi/gig.yaml#/components/responses/BadRequest'
components:
  schemas:
    CheckState:
      type: object
      required: [running, last]
      properties:
        running:
          type: boolean
        last:
          allOf:
            - $ref: '#/components/schemas/CheckResult'
          nullable: true
    CheckResult:
      type: object
      required: [checkedAt, drifts, unreadable, unlinked]
      properties:
        checkedAt:
          type: string
          format: date-time
        drifts:
          type: array
          items:
            $ref: '#/components/schemas/Drift'
        unreadable:
          description: Per platform that couldn't be read, why.
          type: object
          additionalProperties:
            type: string
        unlinked:
          description: Per platform, how many of its events no gig is published as (→ Import).
          type: object
          additionalProperties:
            type: integer
    DriftKind:
      description: MISSING — the event is gone from the platform; DIFFERENT — its copy differs.
      type: string
      enum: [MISSING, DIFFERENT]
    DriftField:
      type: string
      enum: [DATE, TIME, NAME, VENUE, TOWN, COUNTRY, PLACE, CANCELLED]
    DriftDifference:
      type: object
      required: [field, catalog, platform, text]
      properties:
        field:
          $ref: '#/components/schemas/DriftField'
        catalog:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
        text:
          description: The difference in English (the page says it from field and the values).
          type: string
    Drift:
      type: object
      required: [platform, gigId, gigLabel, externalRef, kind, differences]
      properties:
        platform:
          type: string
        gigId:
          description: The gig's token.
          type: string
        gigLabel:
          type: string
        externalRef:
          type: string
        kind:
          $ref: '#/components/schemas/DriftKind'
        differences:
          type: array
          items:
            $ref: '#/components/schemas/DriftDifference'
    DriftRef:
      type: object
      required: [platform, gig]
      properties:
        platform:
          type: string
        gig:
          description: The gig's token.
          type: string
