# This module's persistence tests: an in-memory H2, so no files are written and each run starts clean.
# The schema comes from the Flyway migrations, so they are exercised by every test run.
spring.datasource.url=jdbc:h2:mem:bzscraper-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No database backup from a test.
bzscraper.db.backup.enabled=false
