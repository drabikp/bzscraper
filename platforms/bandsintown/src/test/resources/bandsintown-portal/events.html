<!doctype html>
<html><head><meta charset="utf-8"><title>Events</title>
<style> .row { display:flex; gap:12px; padding:8px; border-bottom:1px solid #ddd } button { min-width:24px; min-height:20px } </style>
</head><body>
<nav><a href="upcoming">Upcoming Events</a> <a href="past">Past Events</a></nav>
<button type="button">Bulk Upload</button>
<div id="list"></div>
<button type="button" id="more" style="display:none">Load more</button>
<div id="menu" role="menu" style="display:none; position:absolute; background:#fff; border:1px solid #999"><div id="menuDelete">Delete</div></div>
<script src="/dialog.js"></script>
<script>
  const past = location.pathname.endsWith('/past');
  document.body.insertAdjacentHTML('beforeend', deleteDialogHtml());
  let chosen = null;
  const openDialog = wireDeleteDialog(() => chosen);
  document.getElementById('menuDelete').onclick = () => { document.getElementById('menu').style.display = 'none'; openDialog(); };
  function render(events) {
    for (const e of events) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>SAT ${e.start_date.slice(8, 10)} AUG</span><span>${e.venue_name}</span><span>${e.venue_city}</span><span>RSVP 3</span>`
          + `<button type="button"><svg width="12" height="12"><circle cx="6" cy="6" r="2"/></svg></button>`;
      row.querySelector('button').onclick = (ev) => {
        chosen = e.id;
        const menu = document.getElementById('menu');
        menu.style.display = 'block'; menu.style.left = ev.pageX + 'px'; menu.style.top = ev.pageY + 'px';
      };
      document.getElementById('list').appendChild(row);
    }
  }
  function load(page) {
    fetch('/api/managed-actors/1/events?past=' + past + (past ? '&page=' + page : ''))
      .then(r => { const next = r.headers.get('x-next-page');
                   return r.json().then(j => { render(j.payload || []);
                     const more = document.getElementById('more');
                     more.style.display = next ? 'block' : 'none';
                     more.onclick = () => load(next); }); });
  }
  load(1);
</script>
</body></html>
