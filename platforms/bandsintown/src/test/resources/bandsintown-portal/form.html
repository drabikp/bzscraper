<!doctype html>
<html><head><meta charset="utf-8"><title>Event</title>
<style> button { min-width:24px; min-height:20px } li { list-style:none } </style>
</head><body>
<form onsubmit="return false">
  <div class="venue"><div><div><input name="venue_name" value="Secret Garden, Obchodná, Bratislava, Slovakia" size="60">
    <button type="button" aria-label="Clear value" id="clear">x</button></div></div></div>
  <ul id="options"></ul>
  <input name="start_date" value="2026-08-29"> <input name="start_time" value="9:00 PM">
  <button type="button" aria-label="Toggle dropdown">v</button>
  <input name="end_date" value=""> <input name="end_time" value="">
  <button type="button" aria-label="Toggle dropdown">v</button>
  <label for="title">Event Name<span>*</span></label><input id="title" name="title" value="Old title">
  <textarea placeholder="Description"></textarea>
  <textarea name="presale">presale notes</textarea>
  <button type="button" id="formDelete">Delete</button> <button type="button" id="save">Save</button>
</form>
<script src="/dialog.js"></script>
<script>
  const eventId = location.pathname.split('/').pop();
  document.body.insertAdjacentHTML('beforeend', deleteDialogHtml());
  const openDialog = wireDeleteDialog(() => eventId);
  document.getElementById('formDelete').onclick = () => openDialog();
  const venue = document.querySelector('input[name=venue_name]');
  document.getElementById('clear').onclick = () => { venue.value = ''; };
  let timer = null;
  venue.addEventListener('input', () => {
    clearTimeout(timer);
    if (venue.value.length < 5) return;
    timer = setTimeout(() => fetch('/api/venues/autocomplete?query=' + encodeURIComponent(venue.value))
      .then(r => r.json()).then(j => {
        const ul = document.getElementById('options');
        ul.innerHTML = '';
        for (const p of j.payload) {
          const li = document.createElement('li');
          li.setAttribute('role', 'option'); li.setAttribute('value', p.place_id);
          li.innerHTML = '<button type="button"></button>';
          li.querySelector('button').textContent = p.description;
          li.querySelector('button').onclick = () => { venue.value = p.description; ul.innerHTML = ''; };
          ul.appendChild(li);
        }
      }), 300);
  });
  document.getElementById('save').onclick = () => fetch('/api/managed-actors/1/events/' + eventId, {
    method: 'PATCH',
    body: JSON.stringify({venue: venue.value, start_date: document.querySelector('input[name=start_date]').value,
                          start_time: document.querySelector('input[name=start_time]').value,
                          title: document.getElementById('title').value,
                          description: document.querySelector('textarea[placeholder=Description]').value})
  });
</script>
</body></html>
