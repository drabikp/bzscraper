<!doctype html><html><head><meta charset="utf-8"><title>Účinkující kapely</title></head><body>
<div id="gigEditLineupBands">
{{BANDS}}
</div>
<form method="post" action="/koncert/{{id}}/update?do=addBandForm-submit">
  <input id="frmaddBandForm-bandIds__addCompleter__container-textInput" name="bandIds__addCompleter__container[textInput]"
         autocomplete="off">
  <ul class="ui-autocomplete" style="display:none"></ul>
  <div id="createBand" style="display:none">
    <input name="bandIds__addCompleter__createItem[name]">
    <button type="button" name="bandIds__addCompleter__createItem[create]">Vytvořit</button>
  </div>
  <ul id="queuedBands"></ul>
  <input type="submit" id="frmaddBandForm-add" name="add" value="Přidat">
</form>
<script>
// The performing-bands tab as the page object meets it: "odstranit z koncertu" asks in a form of
// its own; the band search suggests profiles a moment later (AJAX) and always offers "add a new
// band/performer", whose stub is created at once; picks wait as hidden bandIds[n] until "Přidat".
const concert = '{{id}}';
const form = document.getElementById('frmaddBandForm-add').form;
const search = document.getElementById('frmaddBandForm-bandIds__addCompleter__container-textInput');
const menu = form.querySelector('ul.ui-autocomplete');
const createBand = document.getElementById('createBand');
let queued = 0;
let typing;

function queue(id, name) {
  form.insertAdjacentHTML('beforeend', `<input type="hidden" name="bandIds[${queued++}]" value="${id}">`);
  document.getElementById('queuedBands').insertAdjacentHTML('beforeend', '<li></li>');
  document.getElementById('queuedBands').lastElementChild.textContent = name;
  menu.style.display = 'none';
  search.value = '';
}

search.addEventListener('input', () => {
  clearTimeout(typing);
  typing = setTimeout(() => fetch(`/koncert/${concert}/update?do=addBandForm-bandIds-addCompleter-search&term=`
      + encodeURIComponent(search.value)).then(r => r.json()).then(bands => {
    menu.innerHTML = bands.map(([name, id]) => `<li data-id="${id}"><a href="#"><h4 class="title">${name}</h4></a></li>`)
        .join('') + '<li><a href="#" class="create-link">Přidat novou kapelu / interpreta</a></li>';
    menu.style.display = 'block';
  }), 150);
});

document.addEventListener('click', e => {
  const remove = e.target.closest('#gigEditLineupBands a.delete');
  if (remove) {
    e.preventDefault();
    const id = remove.closest('.editable').id.split('-').pop();
    document.body.insertAdjacentHTML('beforeend', `<form method="post"`
        + ` action="/koncert/${concert}/update?do=gigBands-submit&amp;em=delete&amp;ei=${id}">`
        + '<p>Opravdu odstranit z koncertu?</p><button type="submit" name="delete" value="1">Odstranit</button></form>');
    return;
  }
  const create = e.target.closest('a.create-link');
  if (create) {
    e.preventDefault();
    menu.style.display = 'none';
    createBand.style.display = 'block';
    return;
  }
  const profile = e.target.closest('ul.ui-autocomplete li[data-id]');
  if (profile) {
    e.preventDefault();
    queue(profile.dataset.id, profile.querySelector('h4.title').innerText);
    return;
  }
  if (e.target.name === 'bandIds__addCompleter__createItem[create]') {
    const name = createBand.querySelector('input').value;
    fetch(`/koncert/${concert}/update?do=addBandForm-bandIds-addCompleter-createItem`,
        {method: 'POST', body: new URLSearchParams({'bandIds__addCompleter__createItem[name]': name})})
      .then(r => r.text()).then(id => {
        queue(id, name);
        createBand.style.display = 'none';
      });
  }
});
</script>
</body></html>
